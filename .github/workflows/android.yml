name: Aplicația Android (APK)

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Android SDK (preinstalat pe runner)
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties && ls "$ANDROID_HOME"

      - name: Dependențe + sincronizare Capacitor
        run: |
          npm ci || npm install
          npx cap sync android

      - name: Cheia de semnare (decriptată cu secretul ANDROID_KEY_PASSWORD)
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Lipsește secretul ANDROID_KEY_PASSWORD (Settings → Secrets and variables → Actions)."; exit 1
          fi
          printf '%s' "$ANDROID_KEY_PASSWORD" > "$RUNNER_TEMP/pw"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.p12.enc -out "$RUNNER_TEMP/release.p12" -pass file:"$RUNNER_TEMP/pw"
          rm "$RUNNER_TEMP/pw"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android-app/android
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -f app/google-services.json ] && echo "Firebase: activ" || echo "::warning::Fără google-services.json — notificările nu vor merge în aplicație"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DYASPlanning.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DYASPlanning-apk
          path: DYASPlanning.apk

      - name: Publică pe pagina de descărcare (Releases → android-latest)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest DYASPlanning.apk \
            --title "DYASPlanning Android 1.0.${{ github.run_number }}" \
            --notes "Aplicația Android DYASPlanning. Descarcă DYASPlanning.apk pe telefon și instalează-l. Capturile de ecran sunt blocate pentru angajați și șefi de echipă, permise pentru administrator. Notificări la schimbarea programului și la mesaje noi." \
            --latest
